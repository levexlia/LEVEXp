<svg xmlns="http://www.w3.org/2000/svg" class="lxtm- lx-robot-marker" width="40" height="40" viewBox="0 0 40 40" overflow="visible" role="img"><title>Нажми, чтобы открыть чат с помощником</title><style>
.lxtm- .lxtm-a{transform-box:view-box;transform-origin:0 0}
.lxtm- .lxtm-pr{animation:lxtm-kpr 1.2s ease-out infinite}
@keyframes lxtm-kpr{0%{transform:scale(.85);opacity:.95}100%{transform:scale(1.65);opacity:0}}
.lxtm- .lxtm-bob{animation:lxtm-kbob 2.4s ease-in-out infinite}
@keyframes lxtm-kbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.lxtm- .lxtm-d{animation:lxtm-kd 1.2s steps(1) infinite}
@keyframes lxtm-kd{0%,100%{opacity:.35}12%,45%{opacity:1}}
.lxtm- .lxtm-d2{animation-delay:.2s}.lxtm- .lxtm-d3{animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.lxtm- *{animation:none!important}}
</style><defs><linearGradient id="lxtm-r" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b47bff"/><stop offset="1" stop-color="#22e1ff"/></linearGradient><filter id="lxtm-g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g transform="translate(20 20)"><polygon class="lxtm-a lxtm-pr" points="0.00,-13.00 11.26,-6.50 11.26,6.50 0.00,13.00 -11.26,6.50 -11.26,-6.50" fill="none" stroke="#22e1ff" stroke-width="1.6" transform="scale(1.3)" opacity=".45"/></g><g class="lxtm-a lxtm-bob"><polygon points="20.00,7.50 30.83,13.75 30.83,26.25 20.00,32.50 9.17,26.25 9.17,13.75" fill="#0a1030" stroke="#0a1c46" stroke-width="3"/><polygon points="20.00,7.50 30.83,13.75 30.83,26.25 20.00,32.50 9.17,26.25 9.17,13.75" fill="none" stroke="url(#lxtm-r)" stroke-width="1.7" filter="url(#lxtm-g)"/><path d="M13.5 14.5 H26.5 V23.5 H18.6 L15.5 26.6 V23.5 H13.5 Z" fill="#22e1ff" fill-opacity=".14" stroke="#bff6ff" stroke-width="1.5" stroke-linejoin="round"/><rect class="lxtm-d lxtm-d1" x="15.700000000000001" y="17.9" width="2.2" height="2.2" fill="#bff6ff"/><rect class="lxtm-d lxtm-d2" x="18.9" y="17.9" width="2.2" height="2.2" fill="#bff6ff"/><rect class="lxtm-d lxtm-d3" x="22.099999999999998" y="17.9" width="2.2" height="2.2" fill="#bff6ff"/></g></svg>