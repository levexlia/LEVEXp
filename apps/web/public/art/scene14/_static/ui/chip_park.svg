<svg xmlns="http://www.w3.org/2000/svg" width="77" height="26" viewBox="0 0 77 26" overflow="visible"><style>@font-face{font-family:"LX Tektur";font-weight:600;src:url(data:font/woff;base64,) format("woff")}
.ti{stroke-dasharray:22 78;animation:ti 2.4s linear infinite}
@keyframes ti{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.tg{animation:tg 2.4s ease-in-out infinite}
@keyframes tg{0%,100%{opacity:.62}50%{opacity:1}}
.tgl{animation:tgl 2.4s ease-in-out infinite}
@keyframes tgl{0%,100%{opacity:0}50%{opacity:.6}}
.tgl.sm{animation-name:tgls}@keyframes tgls{0%,48%{opacity:0}72%{opacity:.3}94%,100%{opacity:0}}
.ti.sm{animation:ti 2.4s linear infinite,tis 2.4s linear infinite}@keyframes tis{0%,40%{opacity:1}46%,94%{opacity:0}100%{opacity:1}}
.tgear{transform-box:view-box;transform-origin:24px 24px;animation:tgear 2.4s cubic-bezier(.6,0,.2,1) infinite}
@keyframes tgear{0%,28%{transform:rotate(0)}42%,78%{transform:rotate(22.5deg)}92%,100%{transform:rotate(45deg)}}
.tcube{animation:tcube 2.4s steps(1) infinite}
@keyframes tcube{0%,100%{opacity:1}48%{opacity:.35}50%{opacity:1}54%{opacity:.4}56%{opacity:1}}
